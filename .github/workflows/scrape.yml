name: Daten aktualisieren

on:
  # Wöchentlicher Lauf montags 11:00 Uhr deutscher Zeit (Vollabgleich + Wochenmeldung).
  # GitHub rechnet in UTC: 09:00 UTC = 11:00 Sommerzeit, 10:00 UTC = 11:00 Winterzeit.
  # Der Schritt "Zeitfenster prüfen" lässt jeweils nur den passenden der beiden Läufe weiterlaufen.
  schedule:
    - cron: "0 9 * * 1"
    - cron: "0 10 * * 1"
  workflow_dispatch:
    inputs:
      full:
        description: "Vollabgleich (alle Spielberichte und Kader neu laden)"
        type: boolean
        default: false
      samples:
        description: "Roh-HTML-Proben unter debug/samples ablegen"
        type: boolean
        default: false
      leagues:
        description: "Nur diese Liga-IDs (kommagetrennt, leer = alle)"
        type: string
        default: ""
      test_push:
        description: "Nur eine Test-Push-Nachricht senden (keine Daten laden)"
        type: boolean
        default: false
      diag_pages:
        description: "Nur Roh-HTML dieser Seiten speichern (Diagnose, kommagetrennt)"
        type: string
        default: ""
      sample_reports:
        description: "Nur Roh-HTML dieser Spielbericht-IDs speichern (Diagnose)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Zeitfenster prüfen (11 Uhr Europe/Berlin)
        id: gate
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          RUN=true
          if [ "${{ github.event.inputs.test_push }}" = "true" ]; then RUN=false; fi
          if [ "${{ github.event_name }}" = "schedule" ]; then
            OFFSET=$(TZ=Europe/Berlin date +%z)   # +0100 Winter, +0200 Sommer
            if [ "$SCHEDULE" = "0 9 * * 1" ] && [ "$OFFSET" != "+0200" ]; then RUN=false; fi
            if [ "$SCHEDULE" = "0 10 * * 1" ] && [ "$OFFSET" != "+0100" ]; then RUN=false; fi
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "Lauf ausführen: $RUN (Berlin $(TZ=Europe/Berlin date '+%d.%m.%Y %H:%M %z'))"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true' || github.event.inputs.test_push == 'true'

      - name: Test-Push senden
        if: github.event.inputs.test_push == 'true'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: node scripts/notify.mjs --test

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - run: pip install -r scraper/requirements.txt
        if: steps.gate.outputs.run == 'true'

      - name: Bibliotheken für PDF bereitstellen (einmalig)
        if: steps.gate.outputs.run == 'true'
        run: |
          mkdir -p docs/vendor
          if [ ! -s docs/vendor/jspdf.umd.min.js ]; then
            curl -fsSL -o docs/vendor/jspdf.umd.min.js https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js
          fi
          if [ ! -s docs/vendor/jspdf.plugin.autotable.min.js ]; then
            curl -fsSL -o docs/vendor/jspdf.plugin.autotable.min.js https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js
          fi

      - name: Daten laden
        if: steps.gate.outputs.run == 'true'
        env:
          FULL: ${{ github.event.inputs.full == 'true' || github.event_name == 'schedule' }}
          SAMPLES: ${{ github.event.inputs.samples == 'true' }}
          LEAGUES: ${{ github.event.inputs.leagues }}
          SAMPLE_REPORTS: ${{ github.event.inputs.sample_reports }}
          DIAG_PAGES: ${{ github.event.inputs.diag_pages }}
        run: |
          ARGS=""
          if [ "$FULL" = "true" ]; then ARGS="$ARGS --full"; fi
          if [ "$SAMPLES" = "true" ]; then ARGS="$ARGS --samples"; fi
          if [ -n "$LEAGUES" ]; then ARGS="$ARGS --leagues $LEAGUES"; fi
          if [ -n "$SAMPLE_REPORTS" ]; then ARGS="--sample-reports $SAMPLE_REPORTS"; fi
          if [ -n "$DIAG_PAGES" ]; then ARGS="--diag-pages $DIAG_PAGES"; fi
          python scraper/scrape.py $ARGS

      - name: Push-Benachrichtigung
        if: ${{ steps.gate.outputs.run == 'true' && (github.event_name == 'schedule' || (github.event.inputs.diag_pages == '' && github.event.inputs.sample_reports == '')) }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          WEEKLY: ${{ github.event_name == 'schedule' }}
          NOTIFY_LEVEL: ${{ vars.NOTIFY_LEVEL || 'hinweis' }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: node scripts/notify.mjs

      - name: Änderungen speichern
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "spielbericht-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data docs/vendor debug || true
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Daten aktualisiert $(date -u +'%Y-%m-%d %H:%M') UTC"
            # Bei Überschneidung mit einem anderen Lauf gewinnen die gerade geladenen Daten
            for i in 1 2 3; do
              git fetch origin main
              git rebase -X theirs origin/main || { git rebase --abort; git reset --soft origin/main; git commit -m "Daten aktualisiert $(date -u +'%Y-%m-%d %H:%M') UTC"; }
              git push && break
              sleep 5
            done
          fi
